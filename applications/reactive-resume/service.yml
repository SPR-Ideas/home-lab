# yaml-language-server: $schema=kubernetes
apiVersion: v1
kind: Service
metadata:
  name: reactive-resume
  namespace: default
  labels:
    app: reactive-resume
spec:
  type: ClusterIP
  selector:
    app: reactive-resume
  ports:
  - name: http
    port: 8084
    targetPort: 3000
    protocol: TCP
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333 
      targetPort: 8333 

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres-sql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432 