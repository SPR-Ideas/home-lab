---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate         # RWO volume: don't run old and new pod together
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - -s3
            - -filer
            - -dir=/data
            - -ip=$(POD_IP)        # advertise the pod IP (safer than 0.0.0.0 in k8s)
            - -ip.bind=0.0.0.0     # still listen on all interfaces
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: reactiv-resume-credentials
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: filer, containerPort: 8888 }
            - { name: master, containerPort: 9333 }

          volumeMounts:
            - name: seaweedfs
              mountPath: /data
      volumes:
        - name: seaweedfs
          hostPath:
            path: /volumes/seaweedfs  

---
# compose `seaweedfs_create_bucket` (restart: on-failure) -> Job with retries
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-create-bucket
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-s3
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z seaweedfs 8333; do echo waiting for s3; sleep 3; done"]
      containers:
        - name: create-bucket
          image: amazon/aws-cli:latest
          envFrom:
            - secretRef:
                name: reactiv-resume-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: BUCKET
              value: reactive-resume
          command: ["/bin/sh", "-c"]
          args:
            - |
              aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$BUCKET" 2>/dev/null \
                || aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$BUCKET"